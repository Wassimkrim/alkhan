    <!-- Preload Hero LCP image -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-960.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-960.webp 960w"
      imagesizes="(max-width: 1023px) 100vw, 50vw"
    />

    <!-- Prevent layout flash on persisted AR | FR language preference -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('elkhan_lang');
          if (saved === 'fr') {
            document.documentElement.lang = 'fr';
            document.documentElement.dir = 'ltr';
          } else {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts matching FONT_STYLE.PNG: Noto Kufi Arabic / Cairo ExtraBold + Montserrat ExtraBold + IBM Plex Sans Arabic + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Montserrat:wght@300;400;600;800;900&family=Noto+Kufi+Arabic:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
